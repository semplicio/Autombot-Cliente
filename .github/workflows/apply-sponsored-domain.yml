name: Diagnose sponsored domain client patch

on:
  push:
    branches:
      - feature/sponsored-domain

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/sponsored-domain

      - name: Reconstruct and apply uploaded patch
        shell: bash
        run: |
          head -c 12000 .automation/client.patch.b64.part0 > /tmp/p0
          cp .automation/client.patch.b64.part1 /tmp/p1
          head -c 12000 .automation/client.patch.b64.part2 > /tmp/p2
          head -c 12000 .automation/client.patch.b64.part3 > /tmp/p3
          cp .automation/client.patch.b64.part4 /tmp/p4
          cat /tmp/p0 /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 | base64 -d > /tmp/client.patch
          echo '49b7fed653f8e3e10bc91c7579f5b076e7f8c79c7f415ced121a87ee27b5aee0  /tmp/client.patch' | sha256sum -c -
          git apply /tmp/client.patch
          python .automation/fix_client.py

      - name: Show sponsored sources
        shell: bash
        run: |
          echo '--- files ---'
          find app/src/main/java/com/autombot/client/panel -maxdepth 1 -type f -iname '*sponsor*' -print | sort
          echo '--- symbols ---'
          grep -R -n 'SponsoredDomainSync\|SponsoredRouteValidator\|package com.autombot.client.panel' app/src/main/java/com/autombot/client/panel | head -200
          echo '--- SponsoredDomainSync.kt ---'
          if test -f app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt; then
            sed -n '1,280p' app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt
          else
            echo 'MISSING SponsoredDomainSync.kt'
          fi
          echo '--- git status ---'
          git status --short
          false
