name: Diagnose sponsored domain compilation

on:
  push:
    branches:
      - feature/sponsored-domain

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/sponsored-domain

      - name: Reconstruct and apply uploaded patch
        shell: bash
        run: |
          head -c 12000 .automation/client.patch.b64.part0 > /tmp/p0
          cp .automation/client.patch.b64.part1 /tmp/p1
          head -c 12000 .automation/client.patch.b64.part2 > /tmp/p2
          head -c 12000 .automation/client.patch.b64.part3 > /tmp/p3
          cp .automation/client.patch.b64.part4 /tmp/p4
          cat /tmp/p0 /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 | base64 -d > /tmp/client.patch
          echo '49b7fed653f8e3e10bc91c7579f5b076e7f8c79c7f415ced121a87ee27b5aee0  /tmp/client.patch' | sha256sum -c -
          git apply /tmp/client.patch
          python .automation/fix_client.py
          test -f app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt
          grep -n 'internal object SponsoredDomainSync' app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile from clean state
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean :app:compileDebugKotlin --stacktrace --info
