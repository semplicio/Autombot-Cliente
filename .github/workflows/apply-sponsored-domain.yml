name: Apply sponsored domain client patch

on:
  push:
    branches:
      - feature/sponsored-domain

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/sponsored-domain

      - name: Reconstruct uploaded patch
        run: |
          head -c 12000 .automation/client.patch.b64.part0 > /tmp/p0
          cp .automation/client.patch.b64.part1 /tmp/p1
          head -c 12000 .automation/client.patch.b64.part2 > /tmp/p2
          head -c 12000 .automation/client.patch.b64.part3 > /tmp/p3
          cp .automation/client.patch.b64.part4 /tmp/p4
          cat /tmp/p0 /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 | base64 -d > /tmp/client.patch
          echo '49b7fed653f8e3e10bc91c7579f5b076e7f8c79c7f415ced121a87ee27b5aee0  /tmp/client.patch' | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/client.patch
          git apply /tmp/client.patch
          git diff --check

      - name: Adapt to current main without reintroducing polling
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/autombot/client/ui/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'private const val MANAGED_CONFIG_CHECK_INTERVAL_MS = 15 * 60 * 1000L\nprivate const val SPONSORED_MANIFEST_POLL_INTERVAL_MS = 5 * 60 * 1000L',
              'private const val MANAGED_CONFIG_CHECK_INTERVAL_MS = 60 * 60 * 1000L'
          )

          start = text.index('    suspend fun checkForConfigUpdate() {')
          end = text.index('\n    ModalNavigationDrawer(', start)
          replacement = '''    suspend fun checkForConfigUpdate() {
              if (!isManagedMode) return
              val usuarioGerenciado = appPrefs.getString("managed_usuario", null) ?: return
              val baseUrlGerenciada = appPrefs.getString("managed_base_url", null) ?: return
              val versaoConhecida = appPrefs.getString("managed_config_versao", "")
              val agora = System.currentTimeMillis()
              val ultimaChecagem = appPrefs.getLong("managed_config_last_check_ms", 0L)
              val decorrido = agora - ultimaChecagem
              if (ultimaChecagem > 0L && decorrido >= 0L && decorrido < MANAGED_CONFIG_CHECK_INTERVAL_MS) return

              appPrefs.edit().putLong("managed_config_last_check_ms", agora).apply()
              runCatching {
                  SponsoredDomainSync.refresh(
                      context = context,
                      vlessManager = vlessManager,
                      vmessManager = vmessManager,
                      trojanManager = trojanManager
                  )
              }.onFailure {
                  com.autombot.client.util.AppLog.log(
                      "Falha ao sincronizar domínio patrocinado: ${it.message}",
                      com.autombot.client.util.AppLog.Level.ERROR
                  )
              }

              runCatching {
                  PanelWebhookClient(baseUrlGerenciada).fetchConfigVersion(usuarioGerenciado)
              }.onSuccess { versaoAtual ->
                  val existeAtualizacao = versaoAtual.isNotBlank() && versaoAtual != versaoConhecida
                  updateAvailable = existeAtualizacao
                  appPrefs.edit().putBoolean("managed_config_update_available", existeAtualizacao).apply()
              }
          }

          suspend fun applyConfigUpdate(): Boolean {
              val usuarioGerenciado = appPrefs.getString("managed_usuario", null) ?: return false
              val baseUrlGerenciada = appPrefs.getString("managed_base_url", null) ?: return false
              applyingUpdate = true
              return try {
                  val cliente = PanelWebhookClient(baseUrlGerenciada)
                  val respostaConfigs = cliente.fetchConfigs(usuarioGerenciado)
                  importPanelConfigs(
                      context = context,
                      response = respostaConfigs,
                      wireGuardManager = wireGuardManager,
                      sshManager = sshManager,
                      vlessManager = vlessManager,
                      vmessManager = vmessManager,
                      shadowsocksManager = shadowsocksManager,
                      trojanManager = trojanManager,
                      openVpnManager = openVpnManager
                  )
                  val versaoNova = runCatching { cliente.fetchConfigVersion(usuarioGerenciado) }.getOrNull()
                  val editor = appPrefs.edit()
                      .putLong("managed_config_last_check_ms", System.currentTimeMillis())
                      .putBoolean("managed_config_update_available", false)
                  if (!versaoNova.isNullOrBlank()) editor.putString("managed_config_versao", versaoNova)
                  editor.apply()
                  updateAvailable = false
                  true
              } catch (e: Exception) {
                  com.autombot.client.util.AppLog.log(
                      "Falha ao aplicar atualização de config: ${e.message}",
                      com.autombot.client.util.AppLog.Level.ERROR
                  )
                  false
              } finally {
                  applyingUpdate = false
              }
          }
'''
          text = text[:start] + replacement + text[end:]

          loop = '''            LaunchedEffect(isManagedMode) {
                  while (isManagedMode) {
                      checkForConfigUpdate()
                      delay(SPONSORED_MANIFEST_POLL_INTERVAL_MS)
                  }
              }
'''
          if loop not in text:
              # tolerate indentation emitted by the original patch
              a = text.find('            LaunchedEffect(isManagedMode) {')
              if a >= 0:
                  b = text.find('\n            }', a)
                  if b >= 0:
                      b += len('\n            }')
                      text = text[:a] + '            LaunchedEffect(Unit) { checkForConfigUpdate() }' + text[b:]
          else:
              text = text.replace(loop, '            LaunchedEffect(Unit) { checkForConfigUpdate() }\n')
          main.write_text(text)

          validator = Path('app/src/main/java/com/autombot/client/panel/SponsoredRouteValidator.kt')
          v = validator.read_text()
          v = v.replace('''
                  override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                      complete(false)
                  }
''', '\n')
          validator.write_text(v)

          importer = Path('app/src/main/java/com/autombot/client/panel/panelConfigImporter.kt')
          i = importer.read_text()
          i = i.replace(
              'selecaoVmess.connectHost?.let { parsed.copy(server = it) } ?: parsed',
              'parsed.copy(server = selecaoVmess.connectHost ?: parsed.server)'
          )
          i = i.replace(
              'selecaoVless.connectHost?.let { parsed.copy(server = it) } ?: parsed',
              'parsed.copy(server = selecaoVless.connectHost ?: parsed.server)'
          )
          i = i.replace(
              'selecaoTrojan.connectHost?.let { parsed.copy(server = it) } ?: parsed',
              'parsed.copy(server = selecaoTrojan.connectHost ?: parsed.server)'
          )
          importer.write_text(i)
          PY
          git diff --check

      - name: Verify source policy
        run: |
          if grep -R --line-number --fixed-strings 'mobile.autombot.com.br' app/src/main/java app/src/main/res; then
            echo 'ERRO: domínio sugerido não pode ficar fixo no APK.' >&2
            exit 1
          fi
          if grep -R --line-number 'SPONSORED_MANIFEST_POLL_INTERVAL_MS' app/src/main/java; then
            echo 'ERRO: polling contínuo patrocinado foi reintroduzido.' >&2
            exit 1
          fi
          grep -n 'MANAGED_CONFIG_CHECK_INTERVAL_MS = 60 \* 60 \* 1000L' app/src/main/java/com/autombot/client/ui/MainActivity.kt
          grep -n 'LaunchedEffect(Unit) { checkForConfigUpdate() }' app/src/main/java/com/autombot/client/ui/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compile and assemble
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit final source changes
        run: |
          rm -rf .automation
          rm -f .github/workflows/apply-sponsored-domain.yml
          git config user.name 'AutomBot Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sincronizar domínio patrocinado gerenciável'
          git push origin HEAD:feature/sponsored-domain
