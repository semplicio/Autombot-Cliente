name: Apply sponsored domain client patch

on:
  push:
    branches:
      - feature/sponsored-domain

permissions:
  contents: write

jobs:
  inspect-rejects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/sponsored-domain

      - name: Verify patch chunks
        run: |
          wc -c .automation/client.patch.b64.part*
          sha256sum .automation/client.patch.b64.part*
          false
