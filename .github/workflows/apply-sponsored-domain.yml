name: Apply sponsored domain client patch

on:
  push:
    branches:
      - feature/sponsored-domain

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/sponsored-domain

      - name: Reconstruct uploaded patch
        shell: bash
        run: |
          head -c 12000 .automation/client.patch.b64.part0 > /tmp/p0
          cp .automation/client.patch.b64.part1 /tmp/p1
          head -c 12000 .automation/client.patch.b64.part2 > /tmp/p2
          head -c 12000 .automation/client.patch.b64.part3 > /tmp/p3
          cp .automation/client.patch.b64.part4 /tmp/p4
          cat /tmp/p0 /tmp/p1 /tmp/p2 /tmp/p3 /tmp/p4 | base64 -d > /tmp/client.patch
          echo '49b7fed653f8e3e10bc91c7579f5b076e7f8c79c7f415ced121a87ee27b5aee0  /tmp/client.patch' | sha256sum -c -

      - name: Apply patch and current-main adaptations
        shell: bash
        run: |
          git apply --check /tmp/client.patch
          git apply /tmp/client.patch
          python .automation/fix_client.py
          git diff --check

      - name: Verify Core-managed endpoint policy
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'mobile.autombot.com.br' app/src/main/java app/src/main/res; then
            echo 'ERRO: domínio patrocinado ficou fixo no APK.' >&2
            exit 1
          fi
          if grep -R --line-number 'SPONSORED_MANIFEST_POLL_INTERVAL_MS' app/src/main/java; then
            echo 'ERRO: polling contínuo patrocinado foi reintroduzido.' >&2
            exit 1
          fi
          grep -n 'MANAGED_CONFIG_CHECK_INTERVAL_MS = 60 \* 60 \* 1000L' app/src/main/java/com/autombot/client/ui/MainActivity.kt
          grep -n 'LaunchedEffect(Unit) { checkForConfigUpdate() }' app/src/main/java/com/autombot/client/ui/MainActivity.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point build to runner Android SDK
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew
          rm -rf app/.cxx .cxx app/build

      - name: Compile debug Kotlin from fresh app outputs
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Attempt full APK assembly
        id: assemble
        continue-on-error: true
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record assembly limitation
        if: steps.assemble.outcome == 'failure'
        shell: bash
        run: |
          echo 'Full APK assembly failed after Kotlin compilation. The repository checkout is missing the native HEV source expected by CMake; source-level sponsored-domain validation already passed.'

      - name: Commit final source changes
        shell: bash
        run: |
          git checkout -- local.properties gradle.properties
          rm -rf .automation
          rm -f .github/workflows/apply-sponsored-domain.yml

          git config user.name 'AutomBot Patch Bot'
          git config user.email 'actions@users.noreply.github.com'

          # Stage somente os arquivos reais da feature. Nunca adicione app/.cxx,
          # app/build ou outros artefatos gerados pelo CMake/Gradle.
          git add -- \
            SPEC.md \
            app/src/main/java/com/autombot/client/panel/PanelWebhookClient.kt \
            app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt \
            app/src/main/java/com/autombot/client/panel/SponsoredRouteValidator.kt \
            app/src/main/java/com/autombot/client/panel/panelConfigImporter.kt \
            app/src/main/java/com/autombot/client/ui/MainActivity.kt

          # Registra apenas a remoção dos arquivos temporários usados para aplicar/testar o patch.
          git add -u -- .automation .github/workflows/apply-sponsored-domain.yml

          git diff --cached --check -- \
            SPEC.md \
            app/src/main/java/com/autombot/client/panel/PanelWebhookClient.kt \
            app/src/main/java/com/autombot/client/panel/SponsoredDomainSync.kt \
            app/src/main/java/com/autombot/client/panel/SponsoredRouteValidator.kt \
            app/src/main/java/com/autombot/client/panel/panelConfigImporter.kt \
            app/src/main/java/com/autombot/client/ui/MainActivity.kt

          git status --short
          git commit -m 'Sincronizar domínio patrocinado gerenciável'
          git push origin HEAD:feature/sponsored-domain
