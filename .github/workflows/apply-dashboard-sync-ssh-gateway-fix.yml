name: Apply dashboard sync and SSH gateway fix

on:
  push:
    branches:
      - agent/fix-dashboard-sync-and-ssh-gateway
    paths:
      - .github/scripts/apply_dashboard_sync_ssh_gateway_fix.py

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Patch client
        run: python3 .github/scripts/apply_dashboard_sync_ssh_gateway_fix.py

      - name: Point Gradle to runner Android SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Compile Connect debug Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit validated client changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/autombot/client/protocols/ssh/SshModels.kt \
                  app/src/main/java/com/autombot/client/protocols/ssh/SshTunnelManager.kt \
                  app/src/main/java/com/autombot/client/panel/panelConfigImporter.kt \
                  app/src/main/java/com/autombot/client/panel/PanelWebhookClient.kt \
                  app/src/main/java/com/autombot/client/ui/manual/SshConfigScreen.kt \
                  app/src/main/java/com/autombot/client/ui/MainActivity.kt \
                  app/src/main/java/com/autombot/client/ui/dashboard/DashboardScreen.kt
          git diff --cached --check
          git commit -m "Fix dashboard reconnect, managed sync, and SSH payload gateway"
          git push origin HEAD:agent/fix-dashboard-sync-and-ssh-gateway
