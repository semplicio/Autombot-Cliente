name: Inspect OpenVPN native binary

on:
  push:
    branches:
      - agent/inspect-openvpn-native
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled arm64 OpenVPN executable
        shell: bash
        run: |
          set -euxo pipefail
          BIN=app/src/main/jniLibs/arm64-v8a/libopenvpn.so
          ls -lh "$BIN"
          sha256sum "$BIN"
          file "$BIN"
          readelf -h "$BIN"
          readelf -l "$BIN"
          readelf -d "$BIN" || true
          readelf -n "$BIN" || true
          readelf -A "$BIN" || true
          echo '--- strings: build/compiler/crypto hints ---'
          strings "$BIN" | grep -E -i 'openvpn|openssl|clang|gcc|android|aarch64|armv8|march|mcpu|musl|glibc|bionic' | head -n 250 || true
