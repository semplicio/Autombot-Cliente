name: Validate Network Probe sponsored domain

on:
  push:
    branches: [main]
    paths:
      - 'networkprobe/**'
      - '.github/workflows/validate-networkprobe-sponsored.yml'

permissions:
  contents: read

jobs:
  build-networkprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Point Gradle to runner Android SDK
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew
      - name: Compile Network Probe Kotlin
        run: ./gradlew :networkprobe:compileDebugKotlin --stacktrace
      - name: Assemble Network Probe debug APK
        run: ./gradlew :networkprobe:assembleDebug --stacktrace
      - name: Upload Network Probe debug APK
        uses: actions/upload-artifact@v4
        with:
          name: networkprobe-debug-apk
          path: networkprobe/build/outputs/apk/debug/networkprobe-debug.apk
          if-no-files-found: error
          retention-days: 14
