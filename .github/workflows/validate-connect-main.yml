name: Validate Connect main

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/validate-connect-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Point Gradle to runner Android SDK
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew
      - name: Compile Connect debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace
