name: Apply early trial renewal fix

on:
  push:
    branches:
      - agent/managed-trial-account-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Recognize early trial renewal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/managed-trial-account-sync
          fetch-depth: 0
      - name: Apply early renewal fix
        run: python3 scripts/fix_early_trial_renewal.py
      - name: Validate diff
        run: git diff --check
      - name: Commit source fix
        run: |
          rm -f scripts/fix_early_trial_renewal.py .github/workflows/apply-early-trial-renewal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recognize early trial renewal"
          git push origin HEAD:agent/managed-trial-account-sync
