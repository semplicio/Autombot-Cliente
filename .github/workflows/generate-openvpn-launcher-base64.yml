name: Generate OpenVPN launcher payload

on:
  pull_request:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build launcher
        run: ./gradlew :app:prepareOpenVpnLauncher --stacktrace
      - name: Emit launcher payload
        run: |
          echo 'AUTOMBOT_OVPNEXEC_BASE64_BEGIN'
          base64 -w0 app/src/main/jniLibs/arm64-v8a/libovpnexec.so
          echo
          echo 'AUTOMBOT_OVPNEXEC_BASE64_END'
          sha256sum app/src/main/jniLibs/arm64-v8a/libovpnexec.so
          file app/src/main/jniLibs/arm64-v8a/libovpnexec.so
